<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Connect with Panthera Development to discuss your business's next chapter.">
<title>Connect — Panthera Development</title>
<link rel="icon" type="image/png" href="./favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:#ebeae7; --bg-2:#e3e1dd; --surface:#f3f2f0;
    --text:#111111; --muted:#3a3936; --faint:#8a857d;
    --accent:#c79a5b; --accent-2:#b8893f; --line:#cfccc6; --err:#c0492e;
    --max:1080px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; font-weight:300; line-height:1.7;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    display:flex; flex-direction:column; overflow-x:hidden;
  }
  ::selection { background:var(--accent); color:#fff; }
  .wrap { max-width:var(--max); margin:0 auto; padding:0 32px; width:100%; }

  header {
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 34px; background:rgba(235,234,231,.82);
    backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
  }
  header .brand { display:flex; align-items:center; text-decoration:none; }
  header .brand img { height:38px; width:auto; }
  header nav a {
    color:var(--muted); text-decoration:none; font-size:.82rem;
    letter-spacing:.18em; text-transform:uppercase; transition:color .25s ease;
  }
  header nav a:hover { color:var(--accent-2); }

  main { flex:1; display:flex; align-items:center; padding:150px 0 100px; position:relative; }
  main::before {
    content:""; position:absolute; inset:0;
    background:radial-gradient(900px 520px at 82% 10%, rgba(199,154,91,.08), transparent 60%);
    pointer-events:none;
  }
  .grid { display:grid; grid-template-columns:0.9fr 1.1fr; gap:80px; align-items:center; position:relative; }
  @media (max-width:880px){ .grid { grid-template-columns:1fr; gap:46px; } }

  .intro .eyebrow {
    display:inline-flex; align-items:center; gap:14px; color:var(--accent);
    font-size:.76rem; letter-spacing:.32em; text-transform:uppercase; margin-bottom:26px;
  }
  .intro .eyebrow::before, .intro .eyebrow::after { content:""; width:42px; height:1px; background:var(--accent); }
  .intro h1 {
    font-family:'Cormorant Garamond',serif; font-weight:500;
    font-size:clamp(2.6rem,6vw,4.4rem); line-height:1.05; letter-spacing:-.01em;
  }

  .card {
    background:linear-gradient(180deg,var(--surface),var(--bg-2));
    border:1px solid var(--line); border-radius:3px; padding:46px 44px;
  }
  @media (max-width:520px){ .card { padding:34px 26px; } }
  .field { margin-bottom:24px; }
  .field label {
    display:block; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase;
    color:var(--accent); margin-bottom:9px;
  }
  .field input, .field textarea {
    width:100%; background:rgba(255,255,255,.6); border:1px solid var(--line);
    color:var(--text); font-family:'Inter',sans-serif; font-size:1rem; font-weight:300;
    padding:14px 16px; border-radius:2px; transition:border-color .2s ease, background .2s ease;
  }
  .field input:focus, .field textarea:focus { outline:none; border-color:var(--accent); background:#fff; }
  .field input::placeholder, .field textarea::placeholder { color:#5b574f; }
  .field textarea { resize:vertical; min-height:130px; }
  .field.invalid input, .field.invalid textarea { border-color:var(--err); }
  .field .error {
    color:var(--err); font-size:.74rem; letter-spacing:.05em;
    height:0; overflow:hidden; opacity:0; transition:opacity .2s ease;
  }
  .field.invalid .error { height:auto; opacity:1; margin-top:7px; }

  .submit {
    width:100%; display:inline-flex; align-items:center; justify-content:center; gap:12px;
    background:var(--accent); color:#fff; border:none; cursor:pointer;
    padding:16px; font-family:'Inter',sans-serif; font-weight:500;
    font-size:.84rem; letter-spacing:.2em; text-transform:uppercase; border-radius:2px;
    margin-top:8px; transition:background .25s ease, transform .25s ease, box-shadow .25s ease;
  }
  .submit:hover { background:var(--accent-2); transform:translateY(-2px); box-shadow:0 12px 30px -12px rgba(199,154,91,.6); }
  .submit svg { transition:transform .25s ease; }
  .submit:hover svg { transform:translateX(4px); }

  footer { border-top:1px solid var(--line); padding:30px 0; }
  footer .legal { color:var(--faint); font-size:.8rem; letter-spacing:.05em; text-align:center; }

  .overlay {
    position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:rgba(7,8,9,.78); backdrop-filter:blur(6px);
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .overlay.show { opacity:1; pointer-events:auto; }
  .modal {
    background:linear-gradient(180deg,var(--surface),var(--bg-2));
    border:1px solid var(--line); border-radius:4px; padding:48px 52px; text-align:center;
    max-width:360px; width:90%; transform:translateY(14px) scale(.98);
    transition:transform .3s cubic-bezier(.2,.7,.2,1);
  }
  .overlay.show .modal { transform:none; }
  .modal .mark {
    width:54px; height:54px; margin:0 auto 22px; border-radius:50%;
    border:1px solid var(--accent); display:flex; align-items:center; justify-content:center;
  }
  .modal .mark svg { stroke:var(--accent); }
  .modal h3 { font-family:'Cormorant Garamond',serif; font-weight:500; font-size:2.1rem; margin-bottom:28px; }
  .modal button {
    background:var(--accent); color:#fff; border:none; cursor:pointer;
    padding:12px 46px; font-family:'Inter',sans-serif; font-weight:500;
    font-size:.82rem; letter-spacing:.2em; text-transform:uppercase; border-radius:2px;
    transition:background .25s ease;
  }
  .modal button:hover { background:var(--accent-2); }
</style>
</head>
<body>

  <header>
    <a class="brand" href="index.html">
      <img src="./logo.png" alt="Panthera Development">
    </a>
    <nav><a href="index.html">&larr; Home</a></nav>
  </header>

  <main>
    <div class="wrap grid">
      <div class="intro">
        <span class="eyebrow">Let's talk</span>
        <h1>Let's discuss<br>your next chapter.</h1>
      </div>

      <div class="card">
        <div class="field" id="f-name">
          <label for="name">Name</label>
          <input type="text" id="name" autocomplete="name" placeholder="First &amp; Last Name">
          <div class="error">Required.</div>
        </div>
        <div class="field" id="f-company">
          <label for="company">Company</label>
          <input type="text" id="company" autocomplete="organization" placeholder="Company Name">
          <div class="error">Required.</div>
        </div>
        <div class="field" id="f-email">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="email@example.com">
          <div class="error">Required.</div>
        </div>
        <div class="field" id="f-message">
          <label for="message">Message</label>
          <textarea id="message" placeholder="Tell us briefly about your business"></textarea>
          <div class="error">Required.</div>
        </div>
        <button class="submit" id="sendBtn" type="button">
          Send
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><path d="M1 6h15M11 1l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap"><p class="legal">&copy; 2026 Panthera Development Investments, S.L. All rights reserved.</p></div>
  </footer>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5 11-11" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h3 id="modalTitle">Message sent.</h3>
      <button id="okBtn" type="button">OK</button>
    </div>
  </div>

  <script>
    // Submissions are emailed via FormSubmit (https://formsubmit.co) — no account needed.
    // On first real submission after deploy, FormSubmit sends a one-time confirmation
    // email to stein@panthera-development.com; click the link in it once to activate.
    const FORM_ENDPOINT = 'https://formsubmit.co/ajax/stein@panthera-development.com';

    const fields = ['name', 'company', 'email', 'message'];
    function validate() {
      let ok = true;
      fields.forEach(id => {
        const wrap = document.getElementById('f-' + id);
        if (!document.getElementById(id).value.trim()) { wrap.classList.add('invalid'); ok = false; }
        else { wrap.classList.remove('invalid'); }
      });
      return ok;
    }
    fields.forEach(id => {
      document.getElementById(id).addEventListener('input', () =>
        document.getElementById('f-' + id).classList.remove('invalid'));
    });

    const sendBtn = document.getElementById('sendBtn');

    async function submitForm() {
      if (!validate()) return;
      sendBtn.disabled = true;
      const original = sendBtn.innerHTML;
      sendBtn.textContent = 'Sending…';

      const payload = {
        Name: document.getElementById('name').value.trim(),
        Company: document.getElementById('company').value.trim(),
        Email: document.getElementById('email').value.trim(),
        Message: document.getElementById('message').value.trim(),
        _subject: 'New enquiry via Panthera Development website',
        _template: 'table'
      };

      try {
        const res = await fetch(FORM_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Request failed');
        document.getElementById('overlay').classList.add('show');
      } catch (err) {
        sendBtn.disabled = false;
        sendBtn.innerHTML = original;
        alert("Sorry, your message couldn't be sent. Please email us directly at stein@panthera-development.com.");
      }
    }

    sendBtn.addEventListener('click', submitForm);
    document.getElementById('okBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
